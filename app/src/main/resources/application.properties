# Spring
logging.config=classpath:logback-spring.xml
spring.main.banner_mode=off
spring.aop.auto=false
spring.jmx.enabled=false
server.tomcat.min-spare-threads=10
server.tomcat.max-threads=100

applicationName=regoppslag
applicationVersion=@project.version@
bootstrapVersion=@bootstrap.version@
endpoints.enabled=false
endpoints.camelhealthcheck.enabled=false
endpoints.camelroutecontroller.enabled=false

# App properties
srvappserver_username=srvappserver
srvappserver_password=
SRVREGOPPSLAG_CERT_KEYSTOREALIAS=app-key
VIRKSOMHET_PERSON_V3_READTIMEOUTMS=10000
VIRKSOMHET_PERSON_V3_CONNECTTIMEOUTMS=3000
VIRKSOMHET_ORGANISASJON_V4_READTIMEOUTMS=10000
VIRKSOMHET_ORGANISASJON_V4_CONNECTTIMEOUTMS=3000
