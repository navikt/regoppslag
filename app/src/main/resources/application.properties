# Spring
spring.main.banner_mode=off
spring.aop.auto=false
spring.jmx.enabled=false
server.shutdown=graceful

# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.health.diskspace.enabled=false
# actuator - metrics
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.enable.http.client.requests=false

spring.web.error.include-message=always

#For only including the rest controllers in swagger
springdoc.packages-to-scan=no.nav.regoppslag.rest
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

# Azure
no.nav.security.jwt.issuer.azurev2.accepted-audience=${AZURE_APP_CLIENT_ID}
no.nav.security.jwt.issuer.azurev2.discovery-url=${AZURE_APP_WELL_KNOWN_URL}
