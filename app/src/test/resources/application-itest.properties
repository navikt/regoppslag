#Endpoints to wiremock
regoppslag.endpoints.norg2.url=http://localhost:${wiremock.server.port}/norg2/enhet
regoppslag.endpoints.ereg.url=http://localhost:${wiremock.server.port}/v1/organisasjon/
regoppslag.endpoints.pdl.url=http://localhost:${wiremock.server.port}/graphql
regoppslag.endpoints.pdl.scope=api://itest.teamdokumenthandtering.dokmet/.default
regoppslag.endpoints.dokmet.url=http://localhost:${wiremock.server.port}/
regoppslag.endpoints.digdirkrrproxy.url=http://localhost:${wiremock.server.port}/digdir
regoppslag.endpoints.digdirkrrproxy.scope=api://itest.team-rocket.digdir-krr-proxy/.default
regoppslag.endpoints.override-ms-graph-url=http://localhost:${wiremock.server.port}/msgraph

local.url=http://localhost:${local.server.port}/

no.nav.security.jwt.issuer.tokenx.discoveryUrl=http://localhost:${mock-oauth2-server.port}/tokenx/.well-known/openid-configuration
no.nav.security.jwt.issuer.tokenx.acceptedAudience=regoppslag

no.nav.security.jwt.issuer.azurev2.discoveryUrl=http://localhost:${mock-oauth2-server.port}/azurev2/.well-known/openid-configuration
no.nav.security.jwt.issuer.azurev2.acceptedAudience=regoppslag

azure.openid-config-token-endpoint=http://localhost:${wiremock.server.port}/azure_token
azure.app-tenant-id=azureTenantId
azure.app-client-id=azureClientId
azure.app-client-secret=azureClientSecret

wiremock.reset-mappings-after-each-test=true
spring.main.allow-bean-definition-overriding=true