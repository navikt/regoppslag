name: brevbestilling
image: "docker.adeo.no:5000/dok/brevbestilling"
replicas:
  min: 1
  max: 2
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
resources:
  limits:
    cpu: 1000m
prometheus:
  enabled: true
  path: /prometheus