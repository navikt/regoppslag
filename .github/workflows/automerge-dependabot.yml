name: Automerge Dependabot PRs

on:
  schedule:
    - cron: '0 10 * * 1,2,3,4,5' # UTC time
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@v1
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: '5'