# Manuell instans av regoppslag-redis
# Lagt inn med:
#  kubectl apply -f regoppslag-redis.yaml
apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: teamdokumenthandtering
  name: regoppslag-redis
  namespace: teamdokumenthandtering
spec:
  image: redis:5-alpine
  port: 6379
  replicas:
    min: 1
    max: 1 # More replicas doesn't sync
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 6379
    protocol: redis