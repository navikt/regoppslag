kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: AZURE_APP_TOKEN_URL
      value: {{AZURE_APP_TOKEN_URL}}
    - name: REGOPPSLAG_PROXY_HOST
      value: {{REGOPPSLAG_PROXY_HOST}}
    - name: REGOPPSLAG_PROXY_PORT
      value: "{{REGOPPSLAG_PROXY_PORT}}"
    - name: NORG2_REST_URL
      value: {{ NORG2_REST_URL }}
    - name: EREG_ORGANISASJON_SERVICE_URL
      value: {{ EREG_ORGANISASJON_SERVICE_URL }}
    - name: REGOPPSLAG_ENDPOINTS_PDL_URL
      value: {{ REGOPPSLAG_ENDPOINTS_PDL_URL }}
    - name: REGOPPSLAG_ENDPOINTS_PDL_SCOPE
      value: {{ REGOPPSLAG_ENDPOINTS_PDL_SCOPE }}
    - name: REGOPPSLAG_ENDPOINTS_DOKMET_URL
      value: {{ REGOPPSLAG_ENDPOINTS_DOKMET_URL }}
    - name: REGOPPSLAG_ENDPOINTS_DOKMET_SCOPE
      value: {{ REGOPPSLAG_ENDPOINTS_DOKMET_SCOPE }}
    - name: REGOPPSLAG_ENDPOINTS_DIGDIRKRRPROXY_URL
      value: {{ REGOPPSLAG_ENDPOINTS_DIGDIRKRRPROXY_URL }}
    - name: REGOPPSLAG_ENDPOINTS_DIGDIRKRRPROXY_SCOPE
      value: {{ REGOPPSLAG_ENDPOINTS_DIGDIRKRRPROXY_SCOPE }}
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL }}
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE }}
  image: {{ image }}
  ingresses:
        {{#each INGRESSES}}
          - {{this }}
        {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 4
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  vault:
    enabled: true
  webproxy: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
{{#if AZURE_IAC_RULES}}
      claims:
        extra:
          - "NAVident"
          - "azp_name"
  accessPolicy:
    inbound:
      rules:
      {{#each AZURE_IAC_RULES}}
        - application: {{app}}
          namespace: {{namespace}}
          cluster: {{cluster}}
      {{/each}}
{{/if}}